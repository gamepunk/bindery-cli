<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>书库</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --paper: #ffffff;
        --ink: #262220;
        --ink-soft: #7a7266;
        --rule: #d8d1bd;
        --seal: #a23b2e;
        --seal-dark: #7e2c22;
      }
      body {
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 32px;
        border-bottom: 1px solid var(--rule);
      }
      header h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        font-family: "Songti SC", "STSong", serif;
        letter-spacing: 0.02em;
      }
      .nav a {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 3px;
        background: var(--seal);
        color: #fff;
        text-decoration: none;
        font-size: 13.5px;
        font-weight: 600;
      }
      .nav a:hover {
        background: var(--seal-dark);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 32px 48px;
      }
      .summary {
        color: var(--ink-soft);
        font-size: 13px;
        margin: 0 0 8px;
      }
      .book {
        display: flex;
        gap: 16px;
        padding: 16px 0;
        border-bottom: 1px solid #f0f0f0;
        align-items: center;
      }
      .book:last-child {
        border-bottom: none;
      }
      .cover {
        width: 64px;
        height: 102px;
        object-fit: cover;
        border-radius: 3px;
        background: #f5f5f5;
        border: 1px solid var(--rule);
        flex: none;
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .info h2 {
        margin: 0;
        font-size: 16px;
      }
      .meta {
        color: var(--ink-soft);
        font-size: 13px;
        margin: 4px 0 10px;
      }
      .dl {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 3px;
        background: var(--seal);
        color: #fff;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }
      .dl:hover {
        background: var(--seal-dark);
      }
      .not-built {
        color: #999;
        font-size: 13px;
      }
      .empty {
        text-align: center;
        color: var(--ink-soft);
        padding: 48px 0;
      }
      .empty p {
        margin: 8px 0 0;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 data-i18n="library">书库</h1>
      <div class="nav">
        <a href="/cover" data-i18n="coverGenerator">封面生成器</a>
      </div>
    </header>
    <main>
      <p class="summary" id="summary"></p>
      <div id="books"></div>
    </main>

    <script>
      // ---------- 多语言 ----------
      const LANG = (navigator.language || "en").toLowerCase().startsWith("zh")
        ? "zh"
        : "en";
      const I18N = {
        zh: {
          library: "书库",
          coverGenerator: "封面生成器",
          totalBooks: "共 {n} 本书",
          download: "下载 EPUB",
          notBuilt: "未构建",
          noBooks: "暂无书籍",
          noBooksHint: "运行 bindery new book 创建第一本书",
          loadError: "加载书库失败",
        },
        en: {
          library: "Library",
          coverGenerator: "Cover generator",
          totalBooks: "{n} books",
          download: "Download EPUB",
          notBuilt: "Not built",
          noBooks: "No books yet",
          noBooksHint: "Run bindery new book to create your first book",
          loadError: "Failed to load library",
        },
      };
      const t = (key) => I18N[LANG][key] || I18N.en[key] || key;

      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function applyI18n() {
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
      }

      async function loadBooks() {
        const box = document.getElementById("books");
        const summary = document.getElementById("summary");
        try {
          const res = await fetch("/books.json");
          const data = await res.json();
          const books = data.books || [];
          summary.textContent = t("totalBooks").replace("{n}", books.length);
          if (books.length === 0) {
            box.innerHTML =
              '<div class="empty"><p>' +
              t("noBooks") +
              "</p><p>" +
              t("noBooksHint") +
              "</p></div>";
            return;
          }
          box.innerHTML = books
            .map((b) => {
              const id = esc(b.id || "");
              const title = esc(b.title || "");
              const meta = [b.author, b.dynasty, b.category]
                .filter(Boolean)
                .map(esc)
                .join(" · ");
              const action = b.epub
                ? '<a class="dl" href="/epub/' +
                  id +
                  '.epub" download>' +
                  t("download") +
                  "</a>"
                : '<span class="not-built">' + t("notBuilt") + "</span>";
              return (
                '<div class="book"><img class="cover" src="/cover/' +
                id +
                '" alt="' +
                title +
                '"><div class="info"><h2>' +
                title +
                '</h2><p class="meta">' +
                meta +
                "</p>" +
                action +
                "</div></div>"
              );
            })
            .join("");
        } catch (e) {
          box.innerHTML =
            '<div class="empty"><p>' + t("loadError") + "</p></div>";
        }
      }

      applyI18n();
      loadBooks();
    </script>
  </body>
</html>
