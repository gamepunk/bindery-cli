<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bindery 封面生成器</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --paper: #ffffff;
        --panel: #ffffff;
        --ink: #262220;
        --ink-soft: #7a7266;
        --rule: #d8d1bd;
        --seal: #a23b2e;
        --seal-dark: #7e2c22;
        --seal-tint: rgba(162, 59, 46, 0.14);
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
      }

      ::selection {
        background: var(--seal-tint);
      }

      :focus-visible {
        outline: 2px solid var(--seal);
        outline-offset: 2px;
      }

      .layout {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 32px;
        padding: 24px 28px;
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
        align-items: stretch;
      }

      .panel {
        background: transparent;
        padding: 0;
      }

      .controls {
        flex: 3 1 0;
        min-width: 0;
        overflow-y: auto;
        padding-right: 28px;
        border-right: 1px solid var(--rule);
      }

      .preview {
        flex: 2 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .section {
        margin-bottom: 16px;
      }

      .section:last-of-type {
        margin-bottom: 0;
      }

      .row {
        display: flex;
        gap: 16px;
      }

      .row + .row {
        margin-top: 16px;
      }

      .row > .field {
        flex: 1;
        min-width: 0;
      }

      .row > .field-options {
        flex: 0 0 110px;
        min-width: 0;
      }

      label {
        display: block;
        font-size: 12.5px;
        color: var(--ink-soft);
        margin: 16px 0 6px;
      }

      label:first-child {
        margin-top: 0;
      }

      input[type="text"],
      select {
        width: 100%;
        padding: 7px 2px 8px;
        border: none;
        border-bottom: 1px solid var(--rule);
        border-radius: 0;
        font-size: 14px;
        background: transparent;
        color: var(--ink);
        font-family: inherit;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      input[type="text"]::placeholder {
        color: #b7ae9c;
      }

      select {
        appearance: none;
        -webkit-appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%),
          linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
        background-position:
          calc(100% - 6px) center,
          calc(100% - 1px) center;
        background-size:
          6px 6px,
          6px 6px;
        background-repeat: no-repeat;
        padding-right: 18px;
        cursor: pointer;
      }

      input[type="text"]:focus,
      select:focus {
        outline: none;
        border-bottom: 1px solid var(--accent, var(--seal));
        box-shadow: 0 1px 0 0 var(--accent, var(--seal));
      }

      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        padding: 6px;
      }

      .swatch {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        position: relative;
        transition:
          box-shadow 0.15s,
          transform 0.1s;
      }

      .swatch:hover {
        transform: translateY(-1px);
      }

      .swatch.active {
        box-shadow:
          0 0 0 2px var(--panel),
          0 0 0 4px var(--ink);
      }

      .swatch.active::after {
        content: none;
      }

      .swatch.custom {
        border: none;
        margin: 0;
      }

      .swatch.custom::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(#f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
      }

      .swatch.custom.active {
        box-shadow:
          0 0 0 2px var(--panel),
          0 0 0 4px var(--ink);
      }

      .swatch.custom input[type="color"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
        border: none;
        padding: 0;
        margin: 0;
      }

      canvas {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        display: block;
        border-radius: 2px;
        border: 1px solid var(--rule);
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 3px;
        font-size: 13.5px;
        cursor: pointer;
        font-weight: 600;
        font-family: inherit;
        transition:
          transform 0.08s,
          background 0.15s,
          opacity 0.15s;
      }

      .primary {
        background: var(--accent, var(--seal));
        color: #fff;
      }

      .primary:hover {
        filter: brightness(0.85);
      }

      .primary:active {
        transform: translateY(1px);
      }

      .secondary {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--rule);
      }

      .secondary:hover {
        border-color: var(--ink-soft);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      #status {
        font-size: 12.5px;
        color: var(--ink-soft);
        min-height: 18px;
      }

      @media (max-width: 860px) {
        .layout {
          flex-direction: column;
          overflow-y: auto;
          padding: 20px;
        }

        .controls {
          flex: none;
          width: 100%;
          border-right: none;
          border-bottom: 1px solid var(--rule);
          padding-right: 0;
          padding-bottom: 24px;
          overflow-y: visible;
        }

        .preview {
          padding: 24px 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="panel controls">
        <div class="section">
          <label for="book">选择书籍</label>
          <select id="book">
            <option value="">（无书籍）</option>
          </select>
        </div>

        <div class="section">
          <div class="row">
            <div class="field">
              <label for="title">书名</label>
              <input type="text" id="title" placeholder="书名" />
            </div>
            <div class="field-options">
              <label for="titleAlign">书名对齐</label>
              <select id="titleAlign">
                <option value="center">居中</option>
                <option value="left">左对齐</option>
                <option value="right">右对齐</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label for="subtitle">副标题</label>
              <input type="text" id="subtitle" placeholder="副标题" />
            </div>
            <div class="field-options">
              <label for="placement">副标题位置</label>
              <select id="placement">
                <option value="bottom_right">下方 · 右</option>
                <option value="bottom_left">下方 · 左</option>
                <option value="top_right">上方 · 右</option>
                <option value="top_left">上方 · 左</option>
              </select>
            </div>
          </div>
          <label for="topText">顶部文字</label>
          <input type="text" id="topText" placeholder="一句话介绍这本书" />
          <label for="author">作者</label>
          <input type="text" id="author" placeholder="作者" />
        </div>

        <div class="section">
          <label for="font">字体</label>
          <select id="font"></select>
          <label for="logo">LOGO</label>
          <input type="text" id="logo" value="再读经典" />
          <label>配色</label>
          <div class="swatches" id="colors"></div>
        </div>
      </div>

      <div class="panel preview">
        <canvas id="cover" width="1000" height="1600"></canvas>
        <div class="actions">
          <button class="primary" id="saveBtn" onclick="saveToBook()">
            保存到书籍
          </button>
          <button class="secondary" onclick="downloadPng()">下载 PNG</button>
        </div>
        <div id="status"></div>
      </div>
    </div>

    <script>
      const COLORS = [
        ["Gray", "#6b7280"],
        ["Red", "#ff0000"],
        ["Orange", "#e66a21"],
        ["Yellow", "#f8b824"],
        ["Lime", "#8c9d1a"],
        ["Green", "#449429"],
        ["Teal", "#3a9e9f"],
        ["Cyan", "#06b6d4"],
        ["Sky", "#0ea5e9"],
        ["Blue", "#103fa4"],
        ["Indigo", "#6167b3"],
        ["Violet", "#480d71"],
        ["Fuchsia", "#b8459c"],
      ];
      const FONTS = [
        ["宋体（衬线）", '"Songti SC", "STSong", "SimSun", serif'],
        [
          "黑体（无衬线）",
          '"PingFang SC", "Heiti SC", "Microsoft YaHei", sans-serif',
        ],
        ["楷体", '"Kaiti SC", "KaiTi", "STKaiti", serif'],
        ["仿宋", '"FangSong", "STFangsong", serif'],
        ["Georgia（西文）", "Georgia, serif"],
        ["Helvetica（西文）", "Helvetica, Arial, sans-serif"],
        ["系统默认", "system-ui, -apple-system, sans-serif"],
      ];
      const canvas = document.getElementById("cover");
      const ctx = canvas.getContext("2d");
      const S = 2; // 500x800 逻辑尺寸，2 倍缩放输出

      let color = COLORS[5][1]; // 默认 Green
      let font = FONTS[0][1]; // 默认宋体

      function initSwatches() {
        const box = document.getElementById("colors");
        COLORS.forEach(([name, hex], i) => {
          const s = document.createElement("div");
          s.className = "swatch" + (hex === color ? " active" : "");
          s.title = name;
          s.style.background = hex;
          s.onclick = () => {
            color = hex;
            box
              .querySelectorAll(".swatch")
              .forEach((el) => el.classList.remove("active"));
            s.classList.add("active");
            render();
          };
          box.appendChild(s);
        });

        // 自定义颜色入口（放最后）
        const custom = document.createElement("label");
        custom.className = "swatch custom";
        custom.title = "自定义颜色";
        const input = document.createElement("input");
        input.type = "color";
        input.value = color;
        custom.appendChild(input);
        custom.addEventListener("click", (e) => {
          if (e.target === custom) input.click();
        });
        input.addEventListener("input", () => {
          color = input.value;
          box
            .querySelectorAll(".swatch")
            .forEach((el) => el.classList.remove("active"));
          custom.classList.add("active");
          render();
        });
        box.appendChild(custom);
      }

      function initFonts() {
        const sel = document.getElementById("font");
        FONTS.forEach(([name, family]) => {
          const opt = document.createElement("option");
          opt.value = family;
          opt.textContent = name;
          sel.appendChild(opt);
        });
        sel.value = font;
      }

      function wrapText(text, maxWidth, font) {
        ctx.font = font;
        if (!text) return [""];
        const words = text.split(/\s+/).filter(Boolean);
        const lines = [];
        if (words.length <= 1) {
          let line = "";
          for (const ch of text) {
            const test = line + ch;
            if (line && ctx.measureText(test).width > maxWidth) {
              lines.push(line);
              line = ch;
            } else line = test;
          }
          if (line) lines.push(line);
        } else {
          let line = "";
          for (const w of words) {
            const test = line ? line + " " + w : w;
            if (line && ctx.measureText(test).width > maxWidth) {
              lines.push(line);
              line = w;
            } else line = test;
          }
          if (line) lines.push(line);
        }
        return lines;
      }

      // 书名自动适应字号
      function fitTitle(text, maxWidth) {
        let size = 76;
        while (size > 30) {
          const lines = wrapText(text, maxWidth, `400 ${size}px ${font}`);
          if (lines.length <= 4) return { lines, size };
          size -= 4;
        }
        const lines = wrapText(text, maxWidth, `400 30px ${font}`);
        return { lines, size: 30 };
      }

      function render() {
        const topText = document.getElementById("topText").value;
        const title = document.getElementById("title").value;
        const subtitle = document.getElementById("subtitle").value;
        const author = document.getElementById("author").value;
        const placement = document.getElementById("placement").value;
        font = document.getElementById("font").value;

        // 保存按钮颜色随选中配色同步
        document.documentElement.style.setProperty("--accent", color);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 顶部色条
        ctx.fillStyle = color;
        ctx.fillRect(20 * S, 0, 460 * S, 10 * S);

        // 顶部文字（一句话介绍）
        ctx.fillStyle = "#000";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.font = `400 ${20 * S}px ${font}`;
        ctx.fillText(topText, 250 * S, 14 * S, 460 * S);

        drawTextLayer();
      }

      function drawTextLayer() {
        const logo = document.getElementById("logo").value;
        const title = document.getElementById("title").value;
        const subtitle = document.getElementById("subtitle").value;
        const author = document.getElementById("author").value;
        const placement = document.getElementById("placement").value;

        // 书名块
        const maxW = 420; // 460 - 2*20 边距
        const { lines, size } = fitTitle(title, maxW);
        const lineHeight = size * 1.1;
        const pad = 25;
        const blockH = lines.length * lineHeight + pad * 2;
        const titleTop = Math.round((800 - blockH) / 2);

        ctx.fillStyle = color;
        ctx.fillRect(20 * S, titleTop * S, 460 * S, blockH * S);
        ctx.fillStyle = "#fff";
        ctx.textBaseline = "top";
        ctx.font = `400 ${size * S}px ${font}`;

        const titleAlign = document.getElementById("titleAlign").value;
        let titleX;
        if (titleAlign === "left") {
          ctx.textAlign = "left";
          titleX = 40 * S;
        } else if (titleAlign === "right") {
          ctx.textAlign = "right";
          titleX = 460 * S;
        } else {
          ctx.textAlign = "center";
          titleX = 250 * S;
        }
        lines.forEach((ln, i) => {
          ctx.fillText(ln, titleX, (titleTop + pad + i * lineHeight) * S);
        });

        // 副标题
        const subBelowY = titleTop + blockH + 8;
        const subAboveY = titleTop - 34 - 8;
        ctx.fillStyle = "#000";
        ctx.font = `400 ${34 * S}px ${font}`;
        if (placement === "top_left") {
          ctx.textAlign = "left";
          ctx.fillText(subtitle, 20 * S, subAboveY * S);
        } else if (placement === "top_right") {
          ctx.textAlign = "right";
          ctx.fillText(subtitle, 480 * S, subAboveY * S);
        } else if (placement === "bottom_left") {
          ctx.textAlign = "left";
          ctx.fillText(subtitle, 20 * S, subBelowY * S);
        } else {
          ctx.textAlign = "right";
          ctx.fillText(subtitle, 480 * S, subBelowY * S);
        }

        // LOGO（左下角）
        ctx.fillStyle = "#000";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.font = `400 ${28 * S}px ${font}`;
        ctx.fillText(logo, 20 * S, (800 - 20 - 28) * S);

        // 作者（右下）
        ctx.fillStyle = "#000";
        ctx.textAlign = "right";
        ctx.font = `400 ${24 * S}px ${font}`;
        ctx.fillText(author, 480 * S, (800 - 20 - 24) * S);
      }

      // 加载书籍列表并自动填充
      async function loadBooks() {
        try {
          const res = await fetch("/books.json");
          const data = await res.json();
          const sel = document.getElementById("book");
          (data.books || []).forEach((b) => {
            const opt = document.createElement("option");
            opt.value = b.id;
            opt.textContent = b.title + "（" + b.author + "）";
            sel.appendChild(opt);
          });
          sel.onchange = () => {
            const b = (data.books || []).find((x) => x.id === sel.value);
            if (b) {
              document.getElementById("title").value = b.title || "";
              document.getElementById("author").value = b.author || "";
              document.getElementById("subtitle").value =
                b.category || b.dynasty || "";
              render();
            }
          };
        } catch (e) {
          console.error("加载书籍失败", e);
        }
      }

      function status(msg) {
        document.getElementById("status").textContent = msg;
      }

      async function saveToBook() {
        const bookId = document.getElementById("book").value;
        if (!bookId) {
          status("请先选择要保存到的书籍");
          return;
        }
        const btn = document.getElementById("saveBtn");
        btn.disabled = true;
        try {
          const dataUrl = canvas.toDataURL("image/png");
          const res = await fetch("/cover/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ book: bookId, data: dataUrl }),
          });
          const result = await res.json();
          status(
            result.ok
              ? "✅ 封面已保存到书籍 " + bookId
              : "❌ " + (result.error || "保存失败"),
          );
        } catch (e) {
          status("❌ 保存失败：" + e.message);
        } finally {
          btn.disabled = false;
        }
      }

      function downloadPng() {
        const a = document.createElement("a");
        a.download = "cover.png";
        a.href = canvas.toDataURL("image/png");
        a.click();
      }

      document.querySelectorAll("input[type=text], select").forEach((el) => {
        if (el.id !== "book") {
          el.addEventListener("input", render);
        }
      });

      initSwatches();
      initFonts();
      loadBooks();
      render();
    </script>
  </body>
</html>
